version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: evshare-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-minhhiep}
      MYSQL_DATABASE: ${DB_NAME:-evshare3d}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-minhhiep}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
